# Render Blueprint: backend API (Docker). Database: Render PostgreSQL (free) or Supabase.
# Demo bootstrap is opt-in. Docker defaults BOOTSTRAP_DEMO_DATA to false; enable only for a new, isolated demo database.
# Frontend: Vercel (see frontend/vercel.json). Secrets are set in the dashboard, never committed.
services:
  - type: web
    name: disputeiq-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL        # Supabase connection string, e.g. postgresql+psycopg://...
        sync: false
      - key: CORS_ORIGINS        # your Vercel URL, e.g. https://disputeiq.vercel.app
        sync: false
      - key: APP_ENV
        value: production
      - key: REVIEWER_ACCOUNTS    # "name=key,..." prototype reviewer keys; without it the API refuses case access
        sync: false
      - key: LLM_PROVIDER
        value: gemini            # default: Google Gemini Flash free tier (never silently falls back to mock)
      - key: GEMINI_API_KEY
        sync: false              # Google AI Studio free-tier key — set in the Render dashboard
      - key: GEMINI_MODEL
        value: gemini-3.8-flash  # MUST equal the default in backend/app/core/config.py (a test enforces it). The live Render dashboard value is not verifiable from this repo.
      - key: LLM_MODEL
        sync: false              # optional override of GEMINI_MODEL
      - key: ANTHROPIC_API_KEY
        sync: false              # optional alternate provider
      - key: OPENAI_API_KEY
        sync: false              # optional alternate provider
      - key: EMBEDDING_PROVIDER
        value: hash
