[project]
name = "disputeiq-backend"
version = "0.1.0"
description = "DisputeIQ - AI dispute resolution agent for card issuers"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "pyyaml>=6.0",
    "langgraph>=0.2",
    "google-genai>=1.0",
]


[project.optional-dependencies]
# Full PostgreSQL + pgvector support
postgres = ["psycopg[binary]>=3.2", "pgvector>=0.3"]
# Optional alternate LLM providers (primary is Gemini via google-genai)
anthropicllm = ["anthropic>=0.40"]
openaillm = ["openai>=1.50"]
# Local embeddings (heavier but no API key)
local-embeddings = ["sentence-transformers>=3.0"]
langfuse = ["langfuse>=3.0"]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*", "data_gen*"]

[tool.setuptools.package-data]
"app.rules" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["app/db/migrations/versions", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"data_gen/*" = ["E501"]
"eval/*" = ["E501"]
"app/**" = ["E501"]  # long regex/prose strings; code is wrapped by ruff format
"tests/*" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]

[tool.mypy]
python_version = "3.10"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["app/db/migrations/"]

[[tool.mypy.overrides]]
module = [
    "pgvector.*",
    "sentence_transformers.*",
    "langfuse.*",
    "anthropic.*",
    "openai.*",
    "google.*",
    "google.genai.*",
]
ignore_missing_imports = true
